name: Daily doodle queue

# Midnight in Pakistan (UTC+5) is 19:00 UTC the previous day. GitHub's
# scheduler can lag under load, so the job is idempotent: a late run pins the
# same days a punctual one would, and days already pinned are left alone.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-doodle-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pin the next days into the approved queue
        run: npm run queue:topup

      - name: Check the queue against the SOP minimums
        run: npm run queue:status

      - name: Publish the updated queue
        run: |
          if git diff --quiet -- src/data/schedule.json; then
            echo "Queue unchanged, nothing to publish."
            exit 0
          fi
          git config user.name "daily-doodle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/schedule.json
          git commit -m "Pin the daily doodle queue through $(date -u -d '+14 days' +%Y-%m-%d)"
          git push
